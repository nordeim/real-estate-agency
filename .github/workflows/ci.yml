# CI — the four release gates from AGENTS.md, in order:
# lint → typecheck → test (coverage-gated) → test:e2e (production build).
#
# Notes:
# - `skills/` is excluded from every gate by the repo's own configs
#   (eslint ignores, tsconfig exclude, vitest include, playwright testDir)
#   per the operator contract — it is reference material, not product code.
# - The SQLite db lands at <repo>/db/custom.db: scripts/with-db.ts
#   resolves the relative DATABASE_URL from .env against prisma/schema.prisma.
# - The e2e webServer builds the standalone production server itself
#   (playwright.config.ts) on an isolated distDir and port 3003.
# - Playwright's HTML report is uploaded on failure for triage.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: lint → typecheck → test → e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v3
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create .env from the documented example
        run: |
          cp .env.example .env
          # Generate a real session secret (the example ships a sentinel).
          SECRET="$(openssl rand -base64 32)"
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=\"${SECRET}\"|" .env

      - name: Set up database (schema + seed at <repo>/db/custom.db)
        run: |
          bun run db:push
          bun run db:seed

      - name: Install Playwright Chromium (with system deps)
        run: bunx playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit/integration tests (coverage-gated)
        run: bun run test:coverage

      - name: E2E tests (production standalone build)
        run: bun run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload coverage report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
